<!DOCTYPE html>
<html lang="en">
<head>
  <title>Eatzilla</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <!-- jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-top: 70px;
      margin: 0;
    }

    .navbar-default {
      background: linear-gradient(to bottom, #FF6B35, #D72638);
      border: none;
      border-radius: 0;
      margin-bottom: 0;
    }

    .navbar-default .navbar-brand,
    .navbar-default .navbar-nav > li > a {
      color: white !important;
      font-weight: bold;
    }

    .navbar-default .navbar-nav > li > a:hover,
    .navbar-default .navbar-brand:hover {
      color: #ffc107 !important;
    }

    .navbar-form .btn {
      background: none;
      border: none;
      color: white;
      font-size: 16px;
    }

    .content-wrapper {
      flex: 1;
      padding-bottom: 60px;
    }

    footer {
      background: linear-gradient(to bottom, #FF6B35, #D72638);
      color: white;
      padding: 15px 0;
      margin-top: auto;
    }

    footer a {
      color: #ffc107;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-default navbar-fixed-top">
    <div class="container-fluid">
      <div class="navbar-header">
        <!-- Toggle Button for Mobile -->
        <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#eatzilla-navbar-collapse" aria-expanded="false">
          <span class="sr-only">Toggle navigation</span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
        <a class="navbar-brand" href="{% url 'homepage' %}">Eatzilla</a>
      </div>

      <!-- Menu Items -->
      <div class="collapse navbar-collapse" id="eatzilla-navbar-collapse">
        <ul class="nav navbar-nav">
          <li><a href="{% url 'homepage' %}">Menu</a></li>
          <li><a href="{% url 'order_list' %}">Orders</a></li>
          <li><a href="{% url 'view_wishlist' %}">Wishlist</a></li>
          <li>
            <a href="{% url 'list_cart' %}">
              🛒 Cart <span id="cartitemcount"></span>
            </a>
          </li>
        </ul>
        <ul class="nav navbar-nav navbar-right">
          <li>
            <a href="{% url 'profile_details' %}">
              <i class="fa fa-user"></i> Profile
            </a>
          </li>
          <li>
            <form method="POST" action="{% url 'logout_page' %}" class="navbar-form">
              {% csrf_token %}
              <button type="submit" class="btn">
                <i class="bi bi-box-arrow-right"></i> Logout
              </button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container content-wrapper">
    {% block content %}
    {% endblock %}
  </div>

  <!-- Footer -->
  <footer class="text-center">
    <div class="container">
      <p>&copy; 2025 Eatzilla. All Rights Reserved.</p>
      <ul class="list-inline">
        <li class="list-inline-item"><a href="{% url 'privacy_policy' %}">Privacy Policy</a></li>
        <li class="list-inline-item"><a href="{% url 'terms_of_service' %}">Terms of Service</a></li>
        <li class="list-inline-item"><a href="{% url 'contact' %}">Contact Us</a></li>
      </ul>
    </div>
  </footer>

</body>
</html>
