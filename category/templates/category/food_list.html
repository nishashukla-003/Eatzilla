<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Food List</title>
    <style>
        .food-card {
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease-in-out;
        }
        .food-card:hover {
            transform: scale(1.05);
        }
        .food-card img {
            width: 100%;
            height: 200px;
            object-fit: cover; 
        }
        .food-card .card-body {
            text-align: center;
        }
        .card {
            margin-bottom: 20px;
        }
    </style>
    
</head>
<body>
        <div class="container mt-5">
    <h2 class="text-center mb-4">🍽️ Our Special Food Items</h2>
    <div class="row">
        {% for i in object_list %}
        <div class="col-md-4 mb-4">
            <div class="card food-card">
                <a href="{% url 'food_details' i.id %}">
                    <img src="{{ i.image.url }}" alt="{{ i.name }}" class="card-img-top">
                </a>
                <div class="card-body">
                    <h5 class="card-title">{{ i.name }}</h5>
                    <p class="font-weight-bold text-danger">₹ {{ i.price }}</p>
                </div>
                <div style = "padding-left:70px;">
                <a href="{% url 'food_details' i.id %}" class="btn btn-primary">View Details</a>
                <button href="" class="btn btn-success" onclick=AddtoCart({{ i.id }})>🛒 Add to Cart</button>
                </div>
                     
            </div>
        </div>
        {% empty %}
        <p>No food items available.</p>
        {% endfor %}
    </div>
</div>
</body>
<script>
    let cart = []
    function AddtoCart(cartItemId){
        cart.push('itemn')
        items = cart.length
        fetch("http://127.0.0.1:8000/users/add-to-cart/" + cartItemId + "/")
        .then(function(){
            Swal.fire({
                title: "🎉 Added to Cart!",
                text: "Your food item is waiting in the cart!",
                icon: "success",
                timer: 2000,
                position: 'top',
                showConfirmButton: false
            });
        })
        console.log(cartItemId)
        document.getElementById("cartitemcount").textContent = items 
   }
</script>

</html>
